<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Financiero - Sobres Multi-Moneda</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --danger: #f87171;
      --danger-glow: rgba(248, 113, 113, 0.2);
      --success: #34d399;
      --success-glow: rgba(52, 211, 153, 0.2);
      --bs-color: #fbbf24;
      --usd-color: #34d399;
      --font-num: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 40%),
        radial-gradient(at 50% 50%, rgba(251, 191, 36, 0.03) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      padding: 24px 16px;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: -0.01em;
    }

    /* Dashboard Principal Premium */
    .dashboard-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      position: relative;
      overflow: hidden;
    }

    .dashboard-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25 ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(15, 23, 42, 0.9);
    }

    .num-font {
      font-family: var(--font-num);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-success {
      background: rgba(52, 211, 153, 0.12);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .btn-success:hover {
      background: rgba(52, 211, 153, 0.22);
      box-shadow: 0 4px 12px var(--success-glow);
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.22);
      box-shadow: 0 4px 12px var(--danger-glow);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn:active { transform: scale(0.97); }

    /* Tarjetas de Sobres Tipo Glass Digital */
    .envelopes-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .envelope-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
    }

    .envelope-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .envelope-title {
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .envelope-icon {
      font-size: 1.25rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 10px;
    }

    .envelope-actions {
      display: flex;
      gap: 4px;
    }

    .envelope-balances {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .total-consolidated {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .currency-tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .tag-usd { background: rgba(52, 211, 153, 0.15); color: var(--usd-color); border: 1px solid rgba(52, 211, 153, 0.2); }
    .tag-bs { background: rgba(251, 191, 36, 0.15); color: var(--bs-color); border: 1px solid rgba(251, 191, 36, 0.2); }

    .val-usd { color: var(--usd-color); font-weight: 700; }
    .val-bs { color: var(--bs-color); font-weight: 700; }
    .negative { color: var(--danger) !important; }

    /* Historial */
    details {
      margin-top: 10px;
    }
    summary {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      transition: color 0.2s;
    }
    summary:hover {
      color: var(--accent);
    }
    .history-search {
      margin: 8px 0;
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .history-item {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-desc { color: var(--text-muted); }

    @media (min-width: 480px) {
      body { max-width: 540px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Control de Ahorros</h1>
    <p>Gestión Multi-Moneda (USD / BS)</p>
  </header>

  <!-- Dashboard de Totales Generales -->
  <div class="card dashboard-card">
    <div class="card-title" style="margin-bottom: 12px;">
      <span>👑 Total General Disponible</span>
    </div>
    <div class="envelope-balances" style="background: rgba(0, 0, 0, 0.35);">
      <div class="balance-row">
        <span><span class="currency-tag tag-usd">USD</span>Dólares</span>
        <span class="val-usd num-font" id="dash-usd" style="font-size: 1.05rem;">$0.00</span>
      </div>
      <div class="balance-row">
        <span><span class="currency-tag tag-bs">BS</span>Bolívares</span>
        <span class="val-bs num-font" id="dash-bs" style="font-size: 1.05rem;">Bs. 0.00</span>
      </div>
      <div class="total-consolidated" id="dash-consolidated-container" style="display: none;">
        <span style="font-weight: 600;">Consolidado Estimado</span>
        <span class="num-font" style="font-weight: 700; color: var(--primary); font-size: 1.1rem;" id="dash-consolidated">$0.00</span>
      </div>
    </div>
  </div>

  <!-- Tasa de Cambio del Día -->
  <div class="card" style="padding: 16px 20px;">
    <div class="grid-2" style="align-items: center;">
      <div>
        <label for="exchange-rate" style="margin: 0;">Tasa de Cambio (Bs / $)</label>
      </div>
      <div>
        <input type="number" id="exchange-rate" class="num-font" placeholder="Ej. 36.50" step="0.01" oninput="updateExchangeRate(this.value)">
      </div>
    </div>
  </div>

  <!-- Crear Nuevo Sobre -->
  <div class="card">
    <div class="card-title">📁 Crear Meta / Sobre</div>
    <div class="form-group">
      <label for="env-name">Nombre del Sobre</label>
      <input type="text" id="env-name" placeholder="Ej. Mantenimiento Moto, Salud, Mercado">
    </div>
    <button class="btn btn-primary" onclick="createEnvelope()">+ Crear Sobre</button>
  </div>

  <!-- Registrar Movimiento -->
  <div class="card">
    <div class="card-title">💸 Registrar Movimiento</div>
    
    <div class="form-group">
      <label for="env-select">Seleccionar Sobre</label>
      <select id="env-select"></select>
    </div>

    <div class="grid-2 form-group">
      <div>
        <label for="currency">Moneda</label>
        <select id="currency">
          <option value="USD">Dólares ($)</option>
          <option value="BS">Bolívares (Bs)</option>
        </select>
      </div>
      <div>
        <label for="amount">Monto</label>
        <input type="number" id="amount" class="num-font" placeholder="0.00" step="0.01">
      </div>
    </div>

    <div class="form-group">
      <label for="note">Descripción / Nota (Opcional)</label>
      <input type="text" id="note" placeholder="Ej. Repuesto, medicina, abono">
    </div>

    <div class="grid-2">
      <button class="btn btn-success" onclick="addTransaction('deposit')">+ Abonar</button>
      <button class="btn btn-danger" onclick="addTransaction('expense')">- Gastar</button>
    </div>
  </div>

  <!-- Lista de Sobres -->
  <div class="card">
    <div class="card-title">📊 Estado de tus Sobres</div>
    <div id="envelopes-list" class="envelopes-grid">
      <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px 0;">
        No has creado ningún sobre aún.
      </p>
    </div>
  </div>

  <!-- Respaldo / Drive -->
  <div class="card">
    <div class="card-title">💾 Copia de Seguridad</div>
    <div class="grid-2">
      <button class="btn btn-outline" onclick="exportData()">⬇️ Guardar Backup</button>
      <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">⬆️ Cargar Backup</button>
    </div>
    <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
  </div>

  <script>
    let exchangeRate = parseFloat(localStorage.getItem('exchange_rate')) || 0;
    let envelopes = JSON.parse(localStorage.getItem('envelopes_v2')) || [
      { id: '1', name: 'Mantenimiento Moto', usd: 0, bs: 0, history: [] },
      { id: '2', name: 'Salud / Emergencias', usd: 0, bs: 0, history: [] }
    ];

    document.getElementById('exchange-rate').value = exchangeRate || '';

    // Asignación automática de iconos según el nombre del sobre
    function getEnvelopeIcon(name) {
      const n = name.toLowerCase();
      if (n.includes('moto') || n.includes('repuesto') || n.includes('vehiculo')) return '🏍️';
      if (n.includes('salud') || n.includes('medicina') || n.includes('doctor')) return '🏥';
      if (n.includes('mercado') || n.includes('comida') || n.includes('alimento')) return '🛒';
      if (n.includes('ahorro') || n.includes('meta')) return '🎯';
      if (n.includes('viaje') || n.includes('vacaciones')) return '✈️';
      if (n.includes('casa') || n.includes('hogar')) return '🏠';
      if (n.includes('gusto') || n.includes('salida')) return '🍿';
      return '📁';
    }

    function updateExchangeRate(val) {
      exchangeRate = parseFloat(val) || 0;
      localStorage.setItem('exchange_rate', exchangeRate);
      renderEnvelopes();
    }

    function saveAndRender() {
      localStorage.setItem('envelopes_v2', JSON.stringify(envelopes));
      renderEnvelopes();
    }

    function createEnvelope() {
      const nameInput = document.getElementById('env-name');
      const name = nameInput.value.trim();
      if (!name) return;

      envelopes.push({
        id: Date.now().toString(),
        name: name,
        usd: 0,
        bs: 0,
        history: []
      });

      nameInput.value = '';
      saveAndRender();
    }

    function editEnvelope(id) {
      const env = envelopes.find(e => e.id === id);
      if (!env) return;

      const newName = prompt('Editar nombre del sobre:', env.name);
      if (newName && newName.trim() !== '') {
        env.name = newName.trim();
        saveAndRender();
      }
    }

    function deleteEnvelope(id) {
      const env = envelopes.find(e => e.id === id);
      if (!env) return;

      const confirmDelete = confirm(`¿Estás seguro de que deseas eliminar el sobre "${env.name}"?`);
      if (confirmDelete) {
        envelopes = envelopes.filter(e => e.id !== id);
        saveAndRender();
      }
    }

    function addTransaction(type) {
      const select = document.getElementById('env-select');
      const currency = document.getElementById('currency').value;
      const amountInput = document.getElementById('amount');
      const noteInput = document.getElementById('note');
      const amount = parseFloat(amountInput.value);

      if (!select.value || isNaN(amount) || amount <= 0) return;

      const envelope = envelopes.find(e => e.id === select.value);
      if (envelope) {
        const delta = type === 'deposit' ? amount : -amount;
        if (currency === 'USD') {
          envelope.usd += delta;
        } else {
          envelope.bs += delta;
        }

        if (!envelope.history) envelope.history = [];
        envelope.history.unshift({
          date: new Date().toLocaleDateString('es-VE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }),
          type: type,
          currency: currency,
          amount: amount,
          note: noteInput.value.trim() || (type === 'deposit' ? 'Abono' : 'Gasto')
        });

        amountInput.value = '';
        noteInput.value = '';
        saveAndRender();
      }
    }

    function filterHistory(envId, query) {
      const container = document.getElementById(`history-list-${envId}`);
      const env = envelopes.find(e => e.id === envId);
      if (!env || !container) return;

      const q = query.toLowerCase().trim();
      const filtered = (env.history || []).filter(h => 
        h.note.toLowerCase().includes(q) || h.date.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        container.innerHTML = '<p style="font-size: 0.75rem; color: var(--text-muted); padding: 4px 0;">Sin coincidencias.</p>';
        return;
      }

      container.innerHTML = filtered.map(h => `
        <div class="history-item">
          <span class="history-desc">${h.date} - ${h.note}</span>
          <span class="num-font" style="color: ${h.type === 'deposit' ? 'var(--success)' : 'var(--danger)'}">
            ${h.type === 'deposit' ? '+' : '-'}${h.currency === 'USD' ? '$' : 'Bs.'}${h.amount.toFixed(2)}
          </span>
        </div>
      `).join('');
    }

    function renderEnvelopes() {
      const listContainer = document.getElementById('envelopes-list');
      const selectContainer = document.getElementById('env-select');

      listContainer.innerHTML = '';
      selectContainer.innerHTML = '';

      let totalUSDAll = 0;
      let totalBsAll = 0;

      if (envelopes.length === 0) {
        listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px 0;">No hay sobres registrados.</p>';
      }

      envelopes.forEach(env => {
        totalUSDAll += env.usd;
        totalBsAll += env.bs;

        let totalUSD = env.usd;
        if (exchangeRate > 0) {
          totalUSD += (env.bs / exchangeRate);
        }

        const historyHtml = (env.history && env.history.length > 0)
          ? env.history.map(h => `
              <div class="history-item">
                <span class="history-desc">${h.date} - ${h.note}</span>
                <span class="num-font" style="color: ${h.type === 'deposit' ? 'var(--success)' : 'var(--danger)'}">
                  ${h.type === 'deposit' ? '+' : '-'}${h.currency === 'USD' ? '$' : 'Bs.'}${h.amount.toFixed(2)}
                </span>
              </div>
            `).join('')
          : '<p style="font-size: 0.75rem; color: var(--text-muted); padding: 4px 0;">Sin movimientos registrados.</p>';

        const icon = getEnvelopeIcon(env.name);

        const item = document.createElement('div');
        item.className = 'envelope-card';
        item.innerHTML = `
          <div class="envelope-header">
            <span class="envelope-title">
              <span class="envelope-icon">${icon}</span>
              ${env.name}
            </span>
            <div class="envelope-actions">
              <button class="btn-icon" onclick="editEnvelope('${env.id}')" title="Editar sobre">✏️</button>
              <button class="btn-icon" onclick="deleteEnvelope('${env.id}')" title="Eliminar sobre">🗑️</button>
            </div>
          </div>
          <div class="envelope-balances">
            <div class="balance-row">
              <span><span class="currency-tag tag-usd">USD</span>Dólares</span>
              <span class="val-usd num-font ${env.usd < 0 ? 'negative' : ''}">$${env.usd.toFixed(2)}</span>
            </div>
            <div class="balance-row">
              <span><span class="currency-tag tag-bs">BS</span>Bolívares</span>
              <span class="val-bs num-font ${env.bs < 0 ? 'negative' : ''}">Bs. ${env.bs.toFixed(2)}</span>
            </div>
            ${exchangeRate > 0 ? `
              <div class="total-consolidated">
                <span>Total Estimado</span>
                <span class="num-font" style="font-weight: 700; color: var(--primary);">$${totalUSD.toFixed(2)}</span>
              </div>
            ` : ''}
          </div>
          <details>
            <summary>📋 Historial de Movimientos</summary>
            <input type="text" class="history-search" placeholder="🔍 Buscar nota o fecha..." oninput="filterHistory('${env.id}', this.value)">
            <div class="history-list" id="history-list-${env.id}">
              ${historyHtml}
            </div>
          </details>
        `;
        listContainer.appendChild(item);

        const option = document.createElement('option');
        option.value = env.id;
        option.textContent = `${icon} ${env.name}`;
        selectContainer.appendChild(option);
      });

      // Actualizar Dashboard Superior
      document.getElementById('dash-usd').textContent = `$${totalUSDAll.toFixed(2)}`;
      document.getElementById('dash-bs').textContent = `Bs. ${totalBsAll.toFixed(2)}`;
      
      const dashConsolidatedContainer = document.getElementById('dash-consolidated-container');
      if (exchangeRate > 0) {
        const grandTotalConsolidated = totalUSDAll + (totalBsAll / exchangeRate);
        document.getElementById('dash-consolidated').textContent = `$${grandTotalConsolidated.toFixed(2)}`;
        dashConsolidatedContainer.style.display = 'flex';
      } else {
        dashConsolidatedContainer.style.display = 'none';
      }
    }

    // Funciones de Respaldo y Carga
    function exportData() {
      const dataToExport = {
        exchangeRate: exchangeRate,
        envelopes: envelopes
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `ahorros_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            envelopes = imported;
          } else if (imported.envelopes) {
            envelopes = imported.envelopes;
            if (imported.exchangeRate) {
              exchangeRate = imported.exchangeRate;
              document.getElementById('exchange-rate').value = exchangeRate;
              localStorage.setItem('exchange_rate', exchangeRate);
            }
          }
          saveAndRender();
          alert('¡Copia de seguridad restaurada con éxito!');
        } catch (err) {
          alert('Error al leer el archivo de respaldo.');
        }
      };
      reader.readAsText(file);
    }

    // Inicialización
    renderEnvelopes();
  </script>
</body>
</html>
